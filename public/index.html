<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebGL Mod Status</title>
  <style>
    html,body{margin:0;min-height:100%;background:#08101d;color:#e9f2ff;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(620px,100%);background:#111c2e;border:1px solid #293952;border-radius:18px;padding:28px;box-sizing:border-box;box-shadow:0 18px 60px #0008}h1{margin:0 0 18px;font-size:28px}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #26364d}.row:last-child{border:0}.label{color:#9fb2cc}.value{text-align:right;font-weight:700}.active{color:#52e0bd}.expired,.suspended{color:#ff7b89}.maintenance{color:#ffd166}</style>
</head>
<body>
  <main class="card">
    <h1 id="name">WebGL Mod</h1>
    <div class="row"><span class="label">Trạng thái</span><span id="status" class="value">Đang tải...</span></div>
    <div class="row"><span class="label">Release</span><span id="release" class="value">-</span></div>
    <div class="row"><span class="label">Hết hạn</span><span id="expiry" class="value">-</span></div>
    <div class="row"><span class="label">Thông báo</span><span id="message" class="value">-</span></div>
  </main>
  <script>
    fetch('./control/runtime.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(x=>{document.title=x.displayName||'WebGL Mod';document.getElementById('name').textContent=x.displayName||x.companyName||'WebGL Mod';const s=document.getElementById('status');s.textContent=(x.status||'unknown').toUpperCase();s.className='value '+(x.status||'');document.getElementById('release').textContent=x.activeRelease||'-';document.getElementById('expiry').textContent=x.expiresAt?new Date(x.expiresAt).toLocaleString('vi-VN'):'-';document.getElementById('message').textContent=x.message||'-'}).catch(e=>{document.getElementById('status').textContent='ERROR';document.getElementById('message').textContent=e.message})
  </script>
</body>
</html>
